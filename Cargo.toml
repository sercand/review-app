[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "gh-review-desktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[features]
# Test doubles for the AI pipeline (`ai::testing`), for integration tests that
# drive the worker. Unit tests compile them unconditionally.
ai-testing = []
# Local command classifier: a shiso decision model (`shiso-runtime`). Off by
# default: pulls a large git dependency. Cargo features are target-independent
# and shiso refuses both backends at once, so pick exactly one:
#   macOS (Metal):  --features local-classifier
#   Linux (CUDA):   --features local-classifier-cuda  (CUDA toolkit and
#                   SHISO_CUDA_COMPILE=1; the binary links cuBLAS)
# `local-classifier` is a Metal build; off macOS shiso-metal is a stub, so it
# still compiles on Linux but has no usable device there.
# `_classifier` is internal: it gates the code and pulls the dependency, and
# both public features enable it. Never enable it alone, and never let one
# public feature enable the other.
_classifier = ["dep:shiso-runtime", "dep:shiso-ir"]
local-classifier = ["_classifier", "shiso-runtime/metal"]
local-classifier-cuda = ["_classifier", "shiso-runtime/cuda"]

[[test]]
name = "ai_pipeline"
required-features = ["ai-testing"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(unix)'.dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
globset = "0.4"
ignore = "0.4"
review-approval = { path = "crates/approval" }
review-llm = { path = "crates/llm" }
review-sandbox = { path = "crates/sandbox" }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
tokio-util = "0.7"
url = "2.5"
shiso-runtime = { git = "https://github.com/sercand/shiso-llm", rev = "e3f5a4bbbf82cd6940da2d0a05b102f1cf8b156b", optional = true }
shiso-ir = { git = "https://github.com/sercand/shiso-llm", rev = "e3f5a4bbbf82cd6940da2d0a05b102f1cf8b156b", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "objc2-core-foundation"] }
raw-window-handle = "0.6"
