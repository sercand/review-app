<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull requests — gh-review-desktop</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("ghr.theme"))||"dark"}catch{document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .scope {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 14px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .scope:hover { color: var(--text); background: var(--hover); }
  .scope.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .scope .n { font-size: 11.5px; opacity: .8; }
  .combo { min-width: 200px; cursor: pointer; }
  .combo .val { flex: 1; color: var(--text); white-space: nowrap; }
  .combo .val.ph { color: var(--faint); }

  .list { flex: 1; overflow: auto; }
  .head, .pr {
    display: grid;
    grid-template-columns: 20px minmax(260px, 1fr) 54px 26px 150px 120px 44px 64px;
    align-items: center; column-gap: 14px;
    padding: 0 16px;
  }
  .head { position: sticky; top: 0; z-index: 2; height: 30px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
  .head .r { text-align: right; }
  .pr { height: 52px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .pr:hover { background: var(--surface); }
  .pr.sel { background: var(--accent-soft); }
  .pr .st { color: var(--ok); }
  .pr .st.draft { color: var(--faint); }
  .title { min-width: 0; }
  .title .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .title .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; }
  .title .meta .repo { color: var(--muted); }
  .title .meta .num { color: var(--faint); }
  .title .meta .avatar { width: 16px; height: 16px; font-size: 8px; }
  .why { display: flex; gap: 2px; color: var(--faint); }
  .why svg.lucide { width: 14px; height: 14px; }
  .diff { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font: 500 11.5px var(--font-code); }
  .bar { display: flex; width: 40px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raised); }
  .bar b { background: var(--ok); } .bar s { background: var(--bad); }
  .cm { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--muted); font-size: 12px; }
  .cm.zero { color: var(--faint); opacity: .5; }
  .cm svg.lucide { width: 14px; height: 14px; }
  .upd { text-align: right; color: var(--muted); font-size: 12px; }
  .ci svg.lucide { width: 16px; height: 16px; }
  .group { position: sticky; top: 30px; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line-soft); font-weight: 600; font-size: 12px; }

  .status {
    height: 26px; flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; border-top: 1px solid var(--line); background: var(--surface);
    font-size: 11.5px; color: var(--faint);
  }
  .status span { display: inline-flex; align-items: center; gap: 5px; }
  .status svg.lucide { width: 13px; height: 13px; }
  .empty { padding: 60px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="lights"><span></span><span></span><span></span></div>
    <span style="font-weight:600">Pull requests</span>
    <span class="spacer"></span>
    <button class="btn ghost" onclick="openModal('palette')" style="color:var(--muted)"><i data-lucide="command"></i>Commands <kbd>⌘K</kbd></button>
    <span class="vsep"></span>
    <button class="icon-btn" onclick="toast('Refreshed', 'refresh-cw')" data-tip="Refresh  R"><i data-lucide="refresh-cw"></i></button>
    <button class="icon-btn" data-theme-icon onclick="toggleTheme()" data-tip="Toggle theme"></button>
    <button class="icon-btn" onclick="openModal('settings')" data-tip="Settings"><i data-lucide="settings"></i></button>
    <button class="icon-btn" data-pop="account" data-pop-align="right" data-tip="sercand" data-tip-pos="left" id="me"></button>
  </div>

  <div class="toolbar">
    <div id="scopes" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <span class="vsep"></span>
    <label class="field combo" data-pop="repo-pop"><i data-lucide="book-marked"></i><span class="val ph" id="repo-val">All repositories</span><i data-lucide="chevrons-up-down"></i></label>
    <span class="spacer"></span>
    <label class="field" style="width:260px"><i data-lucide="search"></i><input id="q" placeholder="Filter title, repo or author" oninput="render()"><kbd>/</kbd></label>
    <button class="btn" data-pop="sort-pop" data-pop-align="right"><i data-lucide="arrow-down-wide-narrow"></i><span id="sort-val">Updated</span></button>
  </div>

  <div class="list" id="list"></div>

  <div class="status">
    <span id="count"></span>
    <span><i data-lucide="gauge"></i>Search quota 28 of 30 per minute</span>
    <span class="spacer"></span>
    <span><i data-lucide="mouse-pointer-click"></i>Open with <kbd>↵</kbd></span>
    <span>Move with <kbd>j</kbd> <kbd>k</kbd></span>
  </div>
</div>

<div class="pop" id="repo-pop" style="width:300px">
  <label class="field" style="margin:2px 2px 6px"><i data-lucide="search"></i><input placeholder="owner/repo or org"></label>
  <button class="menu-item" onclick="setRepo(null)"><i data-lucide="layers"></i>All repositories</button>
  <div class="pop-head">Recent</div>
  <button class="menu-item" onclick="setRepo('otsimo/kedis-studio')"><i data-lucide="book-marked"></i>otsimo/kedis-studio</button>
  <button class="menu-item" onclick="setRepo('otsimo/journey')"><i data-lucide="book-marked"></i>otsimo/journey</button>
  <button class="menu-item" onclick="setRepo('sercand/shiso')"><i data-lucide="book-marked"></i>sercand/shiso</button>
  <div class="pop-head">Organizations</div>
  <button class="menu-item" onclick="setRepo('otsimo')"><i data-lucide="building-2"></i>otsimo<span class="end">org</span></button>
</div>

<div class="pop" id="sort-pop">
  <div class="pop-head">Sort by</div>
  <button class="menu-item" onclick="setSort('Updated')"><i data-lucide="clock"></i>Recently updated</button>
  <button class="menu-item" onclick="setSort('Created')"><i data-lucide="calendar-plus"></i>Newest</button>
  <button class="menu-item" onclick="setSort('Comments')"><i data-lucide="message-square"></i>Most commented</button>
  <div class="menu-sep"></div>
  <button class="menu-item" onclick="toggleGroup()"><i data-lucide="group"></i>Group by repository<span class="end" id="group-on"></span></button>
</div>

<div class="pop" id="account">
  <div style="display:flex;gap:10px;align-items:center;padding:8px">
    <span id="me-lg"></span><div><div style="font-weight:600">Sercan Degirmenci</div><div class="faint">sercand on github.com</div></div>
  </div>
  <div class="menu-sep"></div>
  <button class="menu-item" onclick="openModal('settings')"><i data-lucide="settings"></i>Settings<span class="end">⌘,</span></button>
  <a class="menu-item" href="login.html" style="color:var(--text)"><i data-lucide="log-out"></i>Sign out</a>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script>
const SCOPES = [
  { id: "review", label: "Review requested", icon: "eye", n: 14 },
  { id: "assigned", label: "Assigned", icon: "user-check", n: 3 },
  { id: "authored", label: "Authored", icon: "pencil-line", n: 12 },
  { id: "involves", label: "Involves", icon: "users", n: 31 },
  { id: "mentions", label: "Mentions", icon: "at-sign", n: 4 },
];
let on = new Set(store.get("scopes", ["review", "assigned", "authored"]));
let repo = null, sort = "Updated", group = store.get("groupByRepo", false), sel = 0;

// title, repo#num, author, review, draft, ci, +, −, comments, updated, scopes
const PRS = [
  ["Performance: fix long-session memory leaks and top bar, gallery and loading costs", "otsimo/kedis-studio", 2298, "Cem-Celik", "required", 0, "ok", 142, 57, 0, "2h", ["review"]],
  ["Gallery: stop pixel posters from showing up twice after a push notification", "otsimo/kedis-studio", 2300, "Cem-Celik", "required", 0, "pending", 3, 0, 0, "2h", ["review"]],
  ["Flux3 klein", "sercand/shiso-llm", 44, "sercand", "", 0, "ok", 13170, 184, 0, "1d", ["authored"]],
  ["qwen4exp: serve NVIDIA's Qwen3.8-Flash-Next FP4-Local (MXFP8/NVFP4/CSF), FP8 KV, draft-head fixes", "sercand/shiso-llm", 43, "sercand", "", 0, "bad", 34429, 1535, 0, "1d", ["authored"]],
  ["Upgrade Piknik v5", "otsimo/kedis-studio", 2297, "gozdecoban", "required", 0, "ok", 47, 336, 0, "3d", ["review", "assigned"]],
  ["Pixel Art: hint a colour's tiny leftovers, then fill them when the kid is stuck", "otsimo/kedis-studio", 2292, "Cem-Celik", "required", 0, "ok", 554, 10, 2, "3d", ["review"]],
  ["Swap Gabby paw print music variant to a lighter purple sprite", "otsimo/kedis-studio", 2287, "dilaraerbenzer", "required", 0, "ok", 255, 102, 2, "3d", ["review"]],
  ["Fix character icons doesn't load when switch to offline", "otsimo/kedis-studio", 2278, "oguzhanakkayaaa", "required", 0, "bad", 61, 51, 0, "3d", ["review"]],
  ["Cleanup shiso", "sercand/shiso", 315, "sercand", "", 0, "ok", 442773, 463258, 0, "1w", ["authored"]],
  ["Fix the Sticker Reward intact when leaving the gallery wall early", "otsimo/kedis-studio", 2256, "oguzhanakkayaaa", "required", 0, "ok", 155, 56, 0, "1w", ["review"]],
  ["Add EdgeCon container management platform for edge devices", "sercand/shiso", 144, "sercand", "", 0, "none", 25131, 1, 2, "2w", ["authored"]],
  ["Default a push's deep links to the app's bare schemes", "otsimo/journey", 19, "dogacanaydin", "", 0, "ok", 557, 27, 2, "2w", ["assigned"]],
  ["Endpoint slices bug fix", "sercand/kuberesolver", 68, "sercand", "", 0, "ok", 125, 24, 6, "6w", ["authored"]],
  ["Add Sago DevUI debug menu improvements bundle", "otsimo/kedis-studio", 1902, "egealtar", "changes", 0, "ok", 1381, 0, 11, "8w", ["review"]],
  ["Harden canvas scene start chain so exit button cannot get stuck (#1809)", "otsimo/kedis-studio", 1901, "egealtar", "required", 0, "ok", 54, 35, 7, "8w", ["review"]],
  ["EPUB derleme desteği eklendi", "prof-oguzergin/bilgisayar-mimarisi", 1, "sercand", "", 0, "none", 402, 50, 0, "3mo", ["authored"]],
  ["Add Edit Mode unit tests for Storage, App, and Ranking (149 tests)", "otsimo/kedis-studio", 1731, "tayfunotsimo", "changes", 1, "bad", 3518, 37, 10, "3mo", ["review"]],
  ["Talking Pita v2: Polishings", "otsimo/firstwords-games", 1624, "demirkolyigit", "required", 0, "ok", 1108, 784, 11, "11mo", ["review"]],
  ["add offline stuff", "sercand/otsimo-interview-pr", 1, "sercand", "", 0, "none", 648, 10, 0, "1y", ["authored"]],
  ["add power-up system and fix stuff", "sercand/unity-pr", 1, "sercand", "", 0, "none", 345, 4, 0, "1y", ["authored"]],
  ["Add sticker winning logic to home scene", "otsimo/unity-interview", 1, "sercand", "", 0, "none", 474, 79, 0, "2y", ["authored"]],
  ["1397 mouthexercises character animations", "otsimo/firstwords-games", 1676, "utkayd", "required", 0, "ok", 1272130, 314124, 2, "3y", ["review"]],
  ["Talkingpitav2: add offset to button path", "otsimo/firstwords-games", 1634, "cagrifidan", "required", 0, "ok", 43, 13, 3, "3y", ["review"]],
  ["Resolve: \"Webstore: Adding premium-status-change and billing history support\"", "otsimo/mono", 1218, "sinantomruk", "approved", 0, "ok", 813, 22, 5, "3y", ["review"]],
];

const REVIEW = {
  required: `<span class="pill warn"><i data-lucide="eye"></i>Review required</span>`,
  changes: `<span class="pill bad"><i data-lucide="file-diff"></i>Changes requested</span>`,
  approved: `<span class="pill ok"><i data-lucide="check"></i>Approved</span>`,
  "": `<span class="faint" style="font-size:12px">No reviews</span>`,
};
const CI = {
  ok: `<span class="ci add" data-tip="Checks passed"><i data-lucide="circle-check"></i></span>`,
  bad: `<span class="ci del" data-tip="2 checks failed"><i data-lucide="circle-x"></i></span>`,
  pending: `<span class="ci" style="color:var(--warn)" data-tip="Checks running"><i data-lucide="circle-dot-dashed"></i></span>`,
  none: `<span class="ci faint" data-tip="No checks"><i data-lucide="minus"></i></span>`,
};
const fmt = (n) => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k" : n.toLocaleString();

function renderScopes() {
  document.getElementById("scopes").innerHTML = SCOPES.map(s =>
    `<button class="scope ${on.has(s.id) ? "on" : ""}" onclick="toggleScope('${s.id}')" data-tip="${on.has(s.id) ? "Hide" : "Show"} PRs where you're ${s.label.toLowerCase()}">${ico(s.icon)}${s.label}<span class="n">${s.n}</span></button>`
  ).join("");
}
function toggleScope(id) { on.has(id) ? on.delete(id) : on.add(id); store.set("scopes", [...on]); renderScopes(); render(); }
function setRepo(r) { repo = r; const v = document.getElementById("repo-val"); v.textContent = r || "All repositories"; v.classList.toggle("ph", !r); closePops(); render(); }
function setSort(s) { sort = s; document.getElementById("sort-val").textContent = s; closePops(); }
function toggleGroup() { group = !group; store.set("groupByRepo", group); closePops(); render(); }

function row(p, i) {
  const [title, rp, num, author, review, draft, ci, add, del, cm, upd, scopes] = p;
  const tot = add + del || 1;
  const why = scopes.map(s => { const sc = SCOPES.find(x => x.id === s); return `<span data-tip="${sc.label}">${ico(sc.icon)}</span>`; }).join("");
  return `<div class="pr ${i === sel ? "sel" : ""}" onclick="location.href='pr.html'">
    <span class="st ${draft ? "draft" : ""}" data-tip="${draft ? "Draft" : "Open"}" data-tip-pos="right">${ico(draft ? "git-pull-request-draft" : "git-pull-request")}</span>
    <div class="title">
      <div class="t">${title}</div>
      <div class="meta"><span class="repo">${rp}</span><span class="num">#${num}</span><span class="faint">by</span>${avatar(author)}<span>${author}</span>${draft ? `<span class="pill" style="height:16px;font-size:10.5px">Draft</span>` : ""}</div>
    </div>
    <div class="why">${why}</div>
    ${CI[ci]}
    <div>${REVIEW[review]}</div>
    <div class="diff"><span class="add">+${fmt(add)}</span><span class="del">−${fmt(del)}</span><span class="bar"><b style="width:${add / tot * 100}%"></b><s style="width:${del / tot * 100}%"></s></span></div>
    <div class="cm ${cm ? "" : "zero"}">${ico("message-square")}${cm}</div>
    <div class="upd">${upd}</div>
  </div>`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  let rows = PRS.filter(p => p[11].some(s => on.has(s)) || (on.size === 0 && repo));
  if (repo) rows = rows.filter(p => p[1] === repo || p[1].startsWith(repo + "/"));
  if (q) rows = rows.filter(p => (p[0] + p[1] + p[3]).toLowerCase().includes(q));
  const head = `<div class="head"><span></span><span>Pull request</span><span>Why</span><span>CI</span><span>Review</span><span class="r">Changes</span><span class="r"></span><span class="r">Updated</span></div>`;
  let body;
  if (!rows.length) body = `<div class="empty">${ico("inbox")}<p>No open pull requests match.<br><span class="faint">Turn on another scope or pick a different repository.</span></p></div>`;
  else if (group) {
    const by = {}; rows.forEach(r => (by[r[1]] ??= []).push(r));
    let i = 0;
    body = Object.entries(by).map(([r, list]) => `<div class="group">${ico("book-marked")}${r}<span class="faint" style="font-weight:400">${list.length}</span></div>` + list.map(p => row(p, i++)).join("")).join("");
  } else body = rows.map(row).join("");
  document.getElementById("list").innerHTML = head + body;
  document.getElementById("count").innerHTML = `${ico("list")}${rows.length} of ≈${rows.length} loaded`;
  document.getElementById("group-on").innerHTML = group ? ico("check") : "";
  icons();
}

document.addEventListener("keydown", (e) => {
  if (typingTarget(e)) return;
  const n = document.querySelectorAll(".pr").length;
  if (e.key === "j") { sel = Math.min(n - 1, sel + 1); render(); }
  if (e.key === "k") { sel = Math.max(0, sel - 1); render(); }
  if (e.key === "Enter") location.href = "pr.html";
  if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); }
});

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("me").innerHTML = avatar("sercand");
  document.getElementById("me-lg").innerHTML = avatar("sercand", "lg");
  renderScopes(); render();
  injectGlobalModals([
    { label: "Open otsimo/journey#19", icon: "git-pull-request", run: () => (location.href = "pr.html"), keys: ["↵"] },
    { label: "Refresh list", icon: "refresh-cw", run: () => toast("Refreshed", "refresh-cw"), keys: ["R"] },
    { label: "Filter by repository", icon: "book-marked", run: () => document.querySelector("[data-pop=repo-pop]").click() },
    { label: "Toggle theme", icon: "sun-moon", run: () => toggleTheme() },
    { label: "Settings", icon: "settings", run: () => openModal("settings"), keys: ["⌘", ","] },
    { label: "Sign out", icon: "log-out", run: () => (location.href = "login.html") },
  ]);
  mockNav("prs.html");
});
</script>
</body>
</html>
